# NetScaler active/passive for WSUS01 (upstream, primary) and WSUS02 (replica, backup).
# Each node has its own WID database, so NEVER load-balance across both: clients would
# re-register and full-scan every time they switched. All traffic goes to WSUS01; WSUS02
# only takes over when WSUS01 is DOWN.
#
# BOTH ports are required on the VIP even with SSL:
#   8531 = metadata/web services (HTTPS), 8530 = update content (HTTP; files are signed).
# SSL_BRIDGE on 8531 -> certs live on the WSUS nodes (SAN: VIP FQDN + node FQDN).
#
# -disablePrimaryOnDown ENABLED: after a failover, traffic STAYS on WSUS02 even when WSUS01
# comes back. Fail back by hand in a quiet period, so clients only re-register once:
#   enable lb vserver vs_wsus_8530
#   enable lb vserver vs_wsus_8531
# Planned maintenance on WSUS01: disable vs_wsus_8530/8531's service to push clients to WSUS02,
# or just patch WSUS01 inside the window and accept clients waiting for it.

add server wsus01 10.0.0.11
add server wsus02 10.0.0.12

# --- Monitors ---
add lb monitor mon_wsus_8530 HTTP -httpRequest "HEAD /selfupdate/wuident.cab" -respCode 200 -interval 10 -resptimeout 5 -downTime 20
add lb monitor mon_wsus_8531 HTTP -httpRequest "HEAD /selfupdate/wuident.cab" -respCode 200 -secure YES -interval 10 -resptimeout 5 -downTime 20

# --- Primary: WSUS01 ---
add service svc_wsus01_8530 wsus01 HTTP 8530 -cip ENABLED X-Forwarded-For -cltTimeout 1800 -svrTimeout 1800
add service svc_wsus01_8531 wsus01 SSL_BRIDGE 8531 -cltTimeout 1800 -svrTimeout 1800
bind service svc_wsus01_8530 -monitorName mon_wsus_8530
bind service svc_wsus01_8531 -monitorName mon_wsus_8531

add lb vserver vs_wsus_8530 HTTP       10.0.0.10 8530 -cltTimeout 1800 -downStateFlush ENABLED
add lb vserver vs_wsus_8531 SSL_BRIDGE 10.0.0.10 8531 -cltTimeout 1800 -downStateFlush ENABLED
bind lb vserver vs_wsus_8530 svc_wsus01_8530
bind lb vserver vs_wsus_8531 svc_wsus01_8531

# --- Backup: WSUS02 (non-addressable vservers, reached only through -backupVServer) ---
add service svc_wsus02_8530 wsus02 HTTP 8530 -cip ENABLED X-Forwarded-For -cltTimeout 1800 -svrTimeout 1800
add service svc_wsus02_8531 wsus02 SSL_BRIDGE 8531 -cltTimeout 1800 -svrTimeout 1800
bind service svc_wsus02_8530 -monitorName mon_wsus_8530
bind service svc_wsus02_8531 -monitorName mon_wsus_8531

add lb vserver vs_wsus_8530_bk HTTP       0.0.0.0 0 -cltTimeout 1800
add lb vserver vs_wsus_8531_bk SSL_BRIDGE 0.0.0.0 0 -cltTimeout 1800
bind lb vserver vs_wsus_8530_bk svc_wsus02_8530
bind lb vserver vs_wsus_8531_bk svc_wsus02_8531

# --- Failover wiring (controlled failback) ---
set lb vserver vs_wsus_8530 -backupVServer vs_wsus_8530_bk -disablePrimaryOnDown ENABLED
set lb vserver vs_wsus_8531 -backupVServer vs_wsus_8531_bk -disablePrimaryOnDown ENABLED

# DNS: wsus.corp.local -> 10.0.0.10
# Do NOT bind integrated caching / compression policies to these vservers.
